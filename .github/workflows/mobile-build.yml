name: mobile-build

# Builds the Android APK/AAB on Linux and the iOS app (unsigned) on macOS.
# Native projects are generated fresh each run (npx cap add) — nothing
# platform-specific is committed. Builds are published as assets on the
# rolling "mobile-latest" prerelease (NOT as Actions artifacts: those count
# against the account storage quota, which other repos exhaust). The debug
# APK sideloads directly onto an Android phone.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: mobile }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: node sync-www.mjs
      - run: npx cap add android
      - name: Generate icons & splash
        run: npx --yes @capacitor/assets generate --android --assetPath assets --iconBackgroundColor "#0b0e13" --iconBackgroundColorDark "#0b0e13" --splashBackgroundColor "#0b0e13" --splashBackgroundColorDark "#0b0e13" || echo "asset generation failed — default icons used"
      - run: npx cap sync android
      - name: Build debug APK + release AAB (unsigned)
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug bundleRelease
      - name: Publish to rolling release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create mobile-latest --prerelease --title "Mobile builds (rolling)" \
            --notes "Latest CI builds. DRIFT-debug.apk sideloads on Android; the AAB is the unsigned Play upload; the iOS zip is the unsigned .app." \
            2>/dev/null || true
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk DRIFT-debug.apk
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab DRIFT-release-unsigned.aab
          gh release upload mobile-latest DRIFT-debug.apk DRIFT-release-unsigned.aab --clobber

  ios:
    runs-on: macos-latest
    defaults:
      run: { working-directory: mobile }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: node sync-www.mjs
      - run: npx cap add ios
      - name: Generate icons & splash
        run: npx --yes @capacitor/assets generate --ios --assetPath assets --iconBackgroundColor "#0b0e13" --splashBackgroundColor "#0b0e13" || echo "asset generation failed — default icons used"
      - run: npx cap sync ios
      - name: Build (unsigned — signing happens with your Apple account)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package .app
        run: cd dd/Build/Products/Release-iphoneos && zip -r DRIFT-ios-unsigned.zip App.app
      - name: Publish to rolling release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create mobile-latest --prerelease --title "Mobile builds (rolling)" \
            --notes "Latest CI builds. DRIFT-debug.apk sideloads on Android; the AAB is the unsigned Play upload; the iOS zip is the unsigned .app." \
            2>/dev/null || true
          gh release upload mobile-latest mobile/dd/Build/Products/Release-iphoneos/DRIFT-ios-unsigned.zip --clobber
